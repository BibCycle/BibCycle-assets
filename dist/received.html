  <link rel="stylesheet" href="assets/css/bibcycle-core.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: var(--sans);
      background: var(--navy);
      color: #fff;
      padding: 0 24px 96px;
    }

    .rcv-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 620px;
      margin: 0 auto;
      padding: 20px 0 0;
    }
    .rcv-mark {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      transition: color 0.2s;
    }
    .rcv-mark span { color: var(--amber); }
    .rcv-mark:hover { color: #fff; }
    .rcv-lang {
      display: flex;
      gap: 4px;
    }
    .rcv-lang .lang-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.35);
      font-family: var(--sans);
      font-size: 13px;
      letter-spacing: 0.04em;
      padding: 4px 8px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .rcv-lang .lang-btn:hover { color: rgba(255,255,255,0.6); }
    .rcv-lang .lang-btn.active { color: var(--amber); }

    .rcv-wrap {
      max-width: 620px;
      margin: 0 auto;
      text-align: center;
    }

    .rcv-bird {
      width: 132px;
      height: auto;
      opacity: 0.65;
      margin: 48px auto 8px;
      display: block;
    }

    .rcv-s1 {
      font-family: var(--serif);
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 500;
      line-height: 1.6;
      letter-spacing: 0.03em;
      color: #fff;
      margin-bottom: 88px;
      text-wrap: balance;
    }

    .rcv-block { margin-bottom: 80px; }

    .rcv-label {
      font-size: 12px;
      letter-spacing: 0.22em;
      color: var(--amber);
      margin-bottom: 18px;
      font-weight: 400;
    }

    .rcv-body {
      font-size: 16px;
      line-height: 2.1;
      font-weight: 300;
      color: rgba(255,255,255,0.86);
    }

    .rcv-quiet .rcv-body { color: rgba(255,255,255,0.62); }

    .rcv-bird-line {
      font-family: var(--serif);
      font-size: 17px;
      line-height: 2.1;
      font-weight: 400;
      font-style: italic;
      color: rgba(255,255,255,0.5);
    }

    .rcv-btn-group {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 32px;
    }
    .rcv-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 26px;
      border-radius: 12px;
      text-decoration: none;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-align: left;
      transition: transform 0.2s;
    }
    .rcv-btn:hover { transform: translateY(-2px); }
    .rcv-btn-primary { background: var(--amber); color: var(--navy); }
    .rcv-btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
    }
    .rcv-btn-icon { width: 22px; height: 22px; flex-shrink: 0; }
    .rcv-btn-sub { font-size: 11px; font-weight: 300; opacity: 0.7; display: block; }

    .rcv-rule {
      width: 32px;
      height: 1px;
      background: rgba(255,255,255,0.14);
      margin: 0 auto 80px;
    }

    /* 見證位：內容未備時完全不渲染 */
    #rcv-witness { display: none; }

    .rcv-foot {
      max-width: 620px;
      margin: 0 auto;
      padding-top: 40px;
      border-top: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.28);
      letter-spacing: 0.04em;
    }
    .rcv-foot a { color: rgba(255,255,255,0.4); text-decoration: none; }
    .rcv-foot a:hover { color: rgba(255,255,255,0.65); }
    .rcv-foot__tag { margin-bottom: 8px; }

    @media (max-width: 640px) {
      body { padding: 0 22px 72px; }
      .rcv-mark { font-size: 15px; }
      .rcv-s1 { margin-bottom: 64px; }
      .rcv-block { margin-bottom: 60px; }
      .rcv-rule { margin-bottom: 60px; }
      .rcv-btn-group { flex-direction: column; align-items: center; }
      .rcv-btn { width: 100%; max-width: 300px; justify-content: center; }
    }
  </style>
</head>

    <section class="rcv-block">

          <svg class="rcv-btn-icon" viewBox="0 0 24 24" fill="none"><path d="M3.18 23.76c.37.2.8.22 1.21.06l12.3-7.1-2.62-2.62-10.89 9.66zM20.54 10.2L17.1 8.22 14.2 11l3 3 3.35-1.93c.96-.56.96-1.93-.01-2.87zM2.03 1.17C1.69 1.5 1.5 2.01 1.5 2.68v18.64c0 .67.19 1.18.53 1.51l.08.07 10.44-10.44v-.25L2.11 1.1l-.08.07zM14.2 13l-2.65 2.65L2.11 23l12.09-6.99L17.1 13l-2.9-0z" fill="white"/></svg>
          <div><span class="rcv-btn-sub">Get it on</span>Google Play</div>

      </div>
    </section>

    <div class="rcv-rule"></div>

    <!-- 5 你也可以什麼都不做 -->
    <section class="rcv-block rcv-quiet">
      <p class="rcv-body" data-i18n="rcv-s5-body" data-i18n-html="true"></p>
    </section>

    <!-- 6 小鳥一句 -->
    <section class="rcv-block">
      <p class="rcv-bird-line" data-i18n="rcv-s6-bird" data-i18n-html="true"></p>
    </section>

    <!-- 7 見證位（容器；內容未備時完全不渲染） -->
    <section class="rcv-block" id="rcv-witness" aria-hidden="true"></section>

  </main>

  <footer class="rcv-foot">
    <div class="rcv-foot__tag">A door into the Bible · Word &amp; Wings</div>
