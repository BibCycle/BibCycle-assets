  <script>
    const nav = document.getElementById('main-nav');
    window.addEventListener('scroll', () => nav.classList.toggle('is-scrolled', window.scrollY > 60));

    // Lightbox
    function openLightbox(src) {
      document.getElementById('wb-lightbox-img').src = src;
      document.getElementById('wb-lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      document.getElementById('wb-lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

  <div class="wb-lightbox" id="wb-lightbox" onclick="closeLightbox()">
    <img id="wb-lightbox-img" src="" alt="">
  </div>
